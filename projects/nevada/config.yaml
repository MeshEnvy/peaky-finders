# Peaky preset — Nevada reference job (YAML only; legacy `.json` presets are unsupported).
# GDB paths under land.* resolve under ``<preset-directory>/<land.inputs_root>`` unless absolute.
#
simulation:
  provider: los
  situation_pct: 95.0
  time_pct: 95.0
  radius_km: 60.0
  fresnel_clearance_fraction: 0.25
  coverage_pessimism_db: 0.0
  modem_presets:
    meshcore-us:
      frequency_mhz: 910.525
      bandwidth_khz: 62.5
      spreading_factor: 7
      coding_rate: 5
      implementation_margin_db: 3.0
      power_dbm: 22.0
      sensitivity_dbm: -121.0
  environment_presets:
    nevada-desert:
      description: Great Basin arid open terrain — minimal foliage clutter
      climate: desert
      polarization: vertical
      clutter_height_m: 1.0
      ground_dielectric_v_m: 15.0
      ground_conductivity_s_m: 0.005
      atmosphere_bending_n: 301.0
  modem: meshcore-us
  environment: nevada-desert
  transmitter:
    height_m: 2.0
    gain_dbi: 3.0
    loss_db: 2.0
  receiver:
    height_m: 2.0
    gain_dbi: 3.0
    loss_db: 2.0
display:
  colormap: plasma
  transparency: 50
  min_dbm: -130.0
  max_dbm: -80.0
  kml:
    default:
      line: ff666666
      fill: '66888888'
      fill_polygons: true
    aoi:
      line: ffff6600
      fill: 66ffaa66
      fill_polygons: true
    include:
      line: 6600f300
      fill: 6600f300
      fill_polygons: true
      line_width: 0
    exclude:
      line: 660000ff
      fill: 660000ff
      fill_polygons: true
      line_width: 0
    eligible:
      line: 6600f300
      fill: 6600f300
      fill_polygons: true
      line_width: 0
    reference:
      line: ff666666
      fill: '66888888'
      fill_polygons: true
      line_width: 1.0
    summits:
      line: ff0099ff
      fill: '00000000'
      fill_polygons: false
    viewshed_coverage:
      line: '00000000'
      fill: 9900ff00
      fill_polygons: true
      line_width: 0
    mesh:
      depth:
        d1_unique:
          line: '00000000'
          fill: 9900ff00
          fill_polygons: true
          line_width: 0
        d2_pair:
          line: '00000000'
          fill: 9966ff66
          fill_polygons: true
          line_width: 0
        d3_quad:
          line: '00000000'
          fill: 99ffaa00
          fill_polygons: true
          line_width: 0
        d5_plus:
          line: '00000000'
          fill: 99ff0066
          fill_polygons: true
          line_width: 0
      depth_eligible:
        d1_unique:
          line: '00000000'
          fill: 9900ff00
          fill_polygons: true
          line_width: 0
        d2_pair:
          line: '00000000'
          fill: 9966ff66
          fill_polygons: true
          line_width: 0
        d3_quad:
          line: '00000000'
          fill: 99ffaa00
          fill_polygons: true
          line_width: 0
        d5_plus:
          line: '00000000'
          fill: 99ff0066
          fill_polygons: true
          line_width: 0
      pairwise:
        line: '00000000'
        fill: 99ff0000
        fill_polygons: true
        line_width: 0
      pairwise_eligible:
        line: '00000000'
        fill: 99ffff00
        fill_polygons: true
        line_width: 0
  kmz:
    layers:
      viewshed_raster: true
      viewshed_polygon: false
      mesh:
        edges: true
        depth_d1_unique: false
        depth_d2_pair: false
        depth_d3_quad: false
        depth_d5_plus: false
        depth_eligible_d1_unique: false
        depth_eligible_d2_pair: false
        depth_eligible_d3_quad: false
        depth_eligible_d5_plus: false
        pairwise: false
        pairwise_eligible: false
      pins: true
      eligible: false
      exclude: false
      include: false
      aoi: false
land:
  inputs_root: data
  reference:
    - id: blm_nevada_districts
      path: reference/BLM_Nevada_District_Office_Boundary.gdb
      visible: false
      style:
        line: ff4488cc
        fill: 664488cc
        fill_polygons: true
        line_width: 1.5
      layers:
        - admu_district_poly
    - id: blm_nv_field_offices
      path: reference/BLM_NV_Field_Office_Boundary_Polygons.gdb
      visible: false
      style:
        line: ffcc8844
        fill: 66cc8844
        fill_polygons: true
        line_width: 1.0
      layers:
        - admu_ofc_poly
  aoi:
    - path: aoi/State_of_Nevada_Boundary_74510041082641794
      layers:
        - Nevada_State_Boundary
  include:
    - path: include/BLM_Nevada_Surface_Management_Agency.gdb
      layers:
        - name: Land_Status_Dis
          include:
            - name: ABBR
              value: BLM
            - name: ABBR
              value: FS
    - path: include/National_Wildlife_Refuge_System_Boundaries.gdb
      layers:
        - name: FWSBoundaries
  exclude:
    - path: exclude/BLM_Natl_Areas_of_Critical_Environmental_Concern_-8889489521581605133
      layers:
        - name: acec_desig_poly
    - path: exclude/BLM_Natl_Historic_Areas_of_Critical_of_Environmental_Concern_3039259636030657794
      layers:
        - name: acec_hist_poly
    - path: exclude/BLM_Natl_Land_and_Water_Conservation_Fund_LWCF_Polygons_2503496445228609816
      layers:
        - name: BLM_Natl_Land_and_Water_Conservation_Fund__LWCF__Polygons
    - path: exclude/BLM_Natl_NLCS_National_Monuments_National_Conservation_Areas_Polygons_3820554695161457218
      layers:
        - name: BLM_Natl_NLCS_National_Monuments_National_Conservation_Areas_Polygons
    - path: exclude/BLM_Natl_NLCS_Wilderness_Areas_Polygons_-100690039319256330
      layers:
        - name: BLM_Natl_NLCS_Wilderness_Areas_Polygons
    - path: exclude/BLM_Natl_NLCS_Wilderness_Study_Areas_Polygons_-3786779803719444042
      layers:
        - name: BLM_Natl_NLCS_Wilderness_Study_Areas_Polygons
    - path: exclude/FRTCMapData_LandStatus_styled.kml
    - path: exclude/USFS Wilderness Areas.gdb
mesh:
  pairwise: false
  depth: false
  max_raster_dimension: 4096
  pairwise_dem_peak_pin: true
  pairwise_overlap_workers: 8
  mesh_depth_workers: 8
suggest:
