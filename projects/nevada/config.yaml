# Peaky preset — Nevada reference job (YAML only; legacy `.json` presets are unsupported).
# GDB paths under bundle.* resolve under ``<preset-directory>/<bundle.inputs_root>`` unless absolute.
#

# --- Propagation simulation (RF catalogs, antenna chains, coverage engine) ---
simulation:
  provider: los # los | splat — splatter (Fresnel/FSPL) vs legacy SPLAT binary
  verbose: true
  situation_pct: 95.0 # reliability margin on decode threshold (planned splatter wire)
  time_pct: 95.0
  radius_km: 100.0 # search disk / overlay frame, not expected range
  fresnel_clearance_fraction: 0.25 # splatter: knife-edge F₁ clearance; field-calibrated Poito→Russell ~6.75 dB decode margin (0.6 was ~4 dB pessimistic)
  coverage_pessimism_db: 0.0 # extra decode margin folded into emitted request.json modem margins (modem_presets unchanged)

  modem_presets:
    meshcore-us:
      frequency_mhz: 910.525
      bandwidth_khz: 62.5
      spreading_factor: 7
      coding_rate: 5 # 4/5
      implementation_margin_db: 3.0
      power_dbm: 22.0
      sensitivity_dbm: -121.0

  environment_presets:
    nevada-desert:
      description: Great Basin arid open terrain — minimal foliage clutter
      climate: desert # SPLAT ITM/ITWOM only; ignored by splatter
      polarization: vertical
      clutter_height_m: 1.0 # splatter: added to terrain for knife-edge loss
      ground_dielectric_v_m: 15.0
      ground_conductivity_s_m: 0.005
      atmosphere_bending_n: 301.0

  modem: meshcore-us
  environment: nevada-desert

  transmitter:
    height_m: 2.0
    gain_dbi: 3.0
    loss_db: 2.0

  receiver:
    height_m: 2.0
    gain_dbi: 3.0
    loss_db: 2.0

  # max_workers:
  #   los: 1
  #   splat: 8

# --- Raster / KMZ visualization (not physical RF inputs to the solver beyond min/max clamp.) ---
display:
  colormap: plasma
  transparency: 50 # Meshtastic-style % transparency for PNG overlay in Earth
  min_dbm: -130.0
  max_dbm: -80.0

# --- GDB-driven bundle (AOI, eligible land masks, overlays, DEM pin scan, KMZ layer toggles) ---
bundle:
  inputs_root: data

  # Context maps (AOI-clipped; KMZ only — not used for eligibility). Ordered before ``aoi`` in doc.kml.
  reference:
  - id: blm_nevada_districts
    path: reference/BLM_Nevada_District_Office_Boundary.gdb
    visible: false
    style:
      line: ff4488cc
      fill: 664488cc
      fill_polygons: true
      line_width: 1.5
    layers:
    - admu_district_poly
  - id: blm_nv_field_offices
    path: reference/BLM_NV_Field_Office_Boundary_Polygons.gdb
    visible: false
    style:
      line: ffcc8844
      fill: 66cc8844
      fill_polygons: true
      line_width: 1.0
    layers:
    - admu_ofc_poly

  # Outer clip — state hull or arbitrary polygon union
  aoi:
  - path: aoi/State_of_Nevada_Boundary_74510041082641794
    layers:
    - Nevada_State_Boundary

  # Polygons counted as permissible land (attribute filter on GDB layer rows)
  include:
  - path: include/BLM_Nevada_Surface_Management_Agency.gdb
    layers:
    - name: Land_Status_Dis
      include:
      - name: ABBR
        value: BLM
      - name: ABBR
        value: FS
  - path: include/National_Wildlife_Refuge_System_Boundaries.gdb
    layers:
    - name: FWSBoundaries

  # Subtracted before eligible land (wilderness, ACEC, LWCF, etc.)
  exclude:
  - path: 
      exclude/BLM_Natl_Areas_of_Critical_Environmental_Concern_-8889489521581605133
    layers:
    - name: acec_desig_poly
  - path: 
      exclude/BLM_Natl_Historic_Areas_of_Critical_of_Environmental_Concern_3039259636030657794
    layers:
    - name: acec_hist_poly
  - path: 
      exclude/BLM_Natl_Land_and_Water_Conservation_Fund_LWCF_Polygons_2503496445228609816
    layers:
    - name: BLM_Natl_Land_and_Water_Conservation_Fund__LWCF__Polygons
  - path: 
      exclude/BLM_Natl_NLCS_National_Monuments_National_Conservation_Areas_Polygons_3820554695161457218
    layers:
    - name: 
        BLM_Natl_NLCS_National_Monuments_National_Conservation_Areas_Polygons
  - path: exclude/BLM_Natl_NLCS_Wilderness_Areas_Polygons_-100690039319256330
    layers:
    - name: BLM_Natl_NLCS_Wilderness_Areas_Polygons
  - path: 
      exclude/BLM_Natl_NLCS_Wilderness_Study_Areas_Polygons_-3786779803719444042
    layers:
    - name: BLM_Natl_NLCS_Wilderness_Study_Areas_Polygons
  - path: exclude/FRTCMapData_LandStatus_styled.kml

  # KML fill/line defaults (AABBGGRR where applicable — Google Earth convention)
  kml_overlay:
    default:
      line: ff666666
      fill: '66888888'
      fill_polygons: true
    aoi:
      line: ffff6600
      fill: 66ffaa66
      fill_polygons: true
    include:
      line: 6600f300
      fill: 6600f300
      fill_polygons: true
      line_width: 0
    exclude:
      line: 660000ff
      fill: 660000ff
      fill_polygons: true
      line_width: 0
    eligible:
      line: 6600f300
      fill: 6600f300
      fill_polygons: true
      line_width: 0
    reference:
      line: ff666666
      fill: '66888888'
      fill_polygons: true
      line_width: 1.0
    summits:
      line: ff0099ff
      fill: '00000000'
      fill_polygons: false
    viewshed_coverage:
      line: '00000000'
      fill: 9900ff00
      fill_polygons: true
      line_width: 0
    mesh:
      depth:
        d1_unique:
          line: '00000000'
          fill: 9900ff00 # #00ff00; aabbggrr (alpha matches other mesh depth bands)
          fill_polygons: true
          line_width: 0
        d2_pair:
          line: '00000000'
          fill: 9966ff66
          fill_polygons: true
          line_width: 0
        d3_quad:
          line: '00000000'
          fill: 99ffaa00
          fill_polygons: true
          line_width: 0
        d5_plus:
          line: '00000000'
          fill: 99ff0066
          fill_polygons: true
          line_width: 0
      depth_eligible:
        d1_unique:
          line: '00000000'
          fill: 9900ff00
          fill_polygons: true
          line_width: 0
        d2_pair:
          line: '00000000'
          fill: 9966ff66
          fill_polygons: true
          line_width: 0
        d3_quad:
          line: '00000000'
          fill: 99ffaa00
          fill_polygons: true
          line_width: 0
        d5_plus:
          line: '00000000'
          fill: 99ff0066
          fill_polygons: true
          line_width: 0
      pairwise:
        line: '00000000'
        fill: 99ff0000
        fill_polygons: true
        line_width: 0
      pairwise_eligible:
        line: '00000000'
        fill: 99ffff00
        fill_polygons: true
        line_width: 0

  # Footprint overlap-count rasters in aggregate KMZ: EPSG:3857 grid longer edge (px). Higher → finer bands, more CPU/RAM (256–16384).
  mesh_coverage:
    max_raster_dimension: 4096
    # Highest Skadi SRTM cell inside each pairwise / pairwise_eligible footprint ∩ (requires splat tile mirror).
    pairwise_dem_peak_pin: true
    # Pairwise ∩ + DEM placemarks: thread pool size (tiles cached in-process across pairs).
    pairwise_overlap_workers: 8
    # Mesh depth rasters + per-site band slices per render phase.
    mesh_depth_workers: 8

  # doc.kml initial NetworkLink checkbox visibility inside aggregate KMZ
  kmz:
    layers:
      viewshed_raster: true
      viewshed_polygon: false
      mesh:
        edges: true
        depth_d1_unique: false
        depth_d2_pair: false
        depth_d3_quad: false
        depth_d5_plus: false
        depth_eligible_d1_unique: false
        depth_eligible_d2_pair: false
        depth_eligible_d3_quad: false
        depth_eligible_d5_plus: false
        pairwise: false
        pairwise_eligible: false
      pins: true
      eligible: false
      exclude: false
      include: false
      aoi: false

