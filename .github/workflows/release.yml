name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release -p peaky --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/peaky

      - name: Package archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          staging="dist/peaky-${version}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/peaky" "$staging/peaky"
          tar -C "$staging" -czf "dist/peaky-${version}-${{ matrix.target }}.tar.gz" peaky

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/peaky-*.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify changelog
        run: ./scripts/changelog.sh check "${GITHUB_REF_NAME}"

      - name: Prepare release notes
        run: ./scripts/changelog.sh notes "${GITHUB_REF_NAME}" > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*.tar.gz
