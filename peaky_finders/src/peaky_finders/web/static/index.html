<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peaky — Mesh Site Planner</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#111820" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link href="/styles.css?v=9" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <img
            class="brand-logo"
            src="/favicon-96x96.png"
            alt=""
            width="36"
            height="36"
          />
          <div>
            <div class="brand-text">Peaky</div>
            <div class="brand-sub">Finders</div>
          </div>
        </div>

        <div class="controls">
          <div class="control-group">
            <label for="project">Project</label>
            <select id="project"></select>
          </div>
          <div class="control-group">
            <label for="basemap">Map</label>
            <select id="basemap" title="Base map">
              <option value="osm">OpenStreetMap</option>
              <option value="opentopo">OpenTopoMap</option>
              <option value="satellite">Satellite</option>
            </select>
          </div>
        </div>

        <span id="status" class="status-pill">idle</span>
      </header>

      <main class="main">
        <div class="map-wrap">
          <div id="map"></div>
          <aside class="sites-panel" id="sites-panel" aria-label="Sites">
            <button
              type="button"
              id="sites-panel-toggle"
              class="sites-panel-toggle"
              aria-expanded="true"
              aria-controls="sites-panel-body"
              title="Toggle sites panel"
            >
              <span class="sites-panel-chevron" aria-hidden="true"></span>
              <span class="sites-panel-title">Sites</span>
              <span id="sites-panel-count" class="sites-panel-count"></span>
            </button>
            <div id="sites-panel-body" class="sites-panel-body">
              <ul id="sites-list" class="sites-list"></ul>
              <p id="sites-list-empty" class="sites-list-empty" hidden>No sites in project</p>
            </div>
          </aside>
          <div class="map-legend" aria-hidden="true">
            <div class="legend-item">
              <span class="legend-dot viewshed"></span> Viewsheds
            </div>
            <div class="legend-item">
              <span class="legend-icon goal" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="m10.95 14l4.95-4.95l-1.425-1.4l-3.525 3.525L9.525 9.75L8.1 11.175zM5 21V5q0-.825.588-1.412T7 3h10q.825 0 1.413.588T19 5v16l-7-3z"/></svg>
              </span>
              Goals
            </div>
            <div class="legend-item">
              <span class="legend-icon installed" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 20.5V5h7.192l.4 2H19v8h-5.192l-.4-2H7v7.5z"/></svg>
              </span>
              Installed
            </div>
            <div class="legend-item">
              <span class="legend-icon planned" aria-hidden="true">
                <svg viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m13.6 21.076l5.46-3.152c.584-.337.875-.505 1.087-.74a2 2 0 0 0 .416-.72c.097-.301.097-.637.097-1.307V8.843c0-.67 0-1.006-.098-1.307a2 2 0 0 0-.416-.72c-.21-.234-.5-.402-1.079-.736L13.6 2.924c-.583-.337-.874-.505-1.184-.57a2 2 0 0 0-.832 0c-.31.065-.601.233-1.184.57L4.938 6.077c-.582.336-.873.504-1.084.739a2 2 0 0 0-.416.72c-.098.302-.098.638-.098 1.311v6.305c0 .673 0 1.01.098 1.311a2 2 0 0 0 .416.72c.211.236.503.404 1.085.74l5.46 3.153c.584.337.875.505 1.185.57c.274.059.558.059.832 0c.31-.065.602-.233 1.185-.57"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0-6 0"/></g></svg>
              </span>
              Planned
            </div>
            <div class="legend-item">
              <span class="legend-line mesh-link"></span> Site links
            </div>
            <div class="legend-item">
              <span class="legend-dot trial"></span> Trials
            </div>
          </div>
        </div>

        <aside class="sidebar">
          <div class="sidebar-header">
            <h2 class="sidebar-title">Agent trace</h2>
            <p class="sidebar-sub">
              Build progress and mesh-grow-ai tool calls
            </p>
          </div>
          <div id="chat" class="chat">
            <div id="chat-empty" class="chat-empty">
              <div class="chat-empty-icon" aria-hidden="true">◎</div>
              <p>
                Say hello below to start a conversation with the agent.
              </p>
            </div>
          </div>
          <div id="chat-context" class="chat-context" aria-live="polite">
            <div class="chat-context-row">
              <span class="chat-context-label">Context</span>
              <button
                id="chat-copy-context"
                type="button"
                class="chat-copy-context"
                title="Copy context as JSON"
                aria-label="Copy context as JSON"
              >
                {}
              </button>
              <span id="chat-context-detail" class="chat-context-detail">—</span>
              <span id="chat-context-pct" class="chat-context-pct">0%</span>
            </div>
            <div
              class="chat-context-track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              id="chat-context-track"
            >
              <div id="chat-context-fill" class="chat-context-fill"></div>
            </div>
            <p id="chat-context-note" class="chat-context-note" hidden></p>
            <button id="chat-summarize" type="button" class="chat-summarize" hidden>
              Summarize &amp; reset context
            </button>
          </div>
          <form id="chat-form" class="chat-composer">
            <input
              id="chat-input"
              type="text"
              placeholder="Say hello…"
              autocomplete="off"
            />
            <button id="chat-send" type="submit">Send</button>
          </form>
        </aside>
      </main>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="/app.js?v=33"></script>
  </body>
</html>
