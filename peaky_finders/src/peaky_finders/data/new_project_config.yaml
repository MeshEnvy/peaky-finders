# Peaky Finders project preset — edit paths, layers, and sites before building.
simulation:
  provider: los
  radius_km: 50.0
  modem_presets:
    meshcore-us:
      frequency_mhz: 910.525
      bandwidth_khz: 62.5
      spreading_factor: 7
      coding_rate: 5
      implementation_margin_db: 3.0
      power_dbm: 22.0
      sensitivity_dbm: -121.0
  environment_presets:
    open:
      climate: desert
      polarization: vertical
      clutter_height_m: 1.0
  modem: meshcore-us
  environment: open
  transmitter:
    height_m: 2.0
    gain_dbi: 3.0
    loss_db: 2.0
  receiver:
    height_m: 2.0
    gain_dbi: 3.0
    loss_db: 2.0

display:
  colormap: plasma
  min_dbm: -130.0
  max_dbm: -80.0

bundle:
  inputs_root: data
  aoi:
    - path: aoi/region.gdb
      layers:
        - name: boundary
  include: []
  exclude: []

sites:
  hub:
    name: Hub
    loc: [39.5, -119.5]
    sees: []
