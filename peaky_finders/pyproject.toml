[tool.poetry]
name = "peaky-finders"
version = "0.1.0"
description = "LoRa viewshed CLI (splatter, KML output)"
authors = []
packages = [{ include = "peaky_finders", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.9"
pillow = "^12.2.0"
boto3 = "^1.35"
geopandas = "^1.0"
numpy = "^2.0"
pyogrio = "^0.9"
rasterio = "^1.4"
pyproj = "^3.6"
shapely = "^2.0"
matplotlib = "^3.8"
ruamel-yaml = "^0.18"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.poetry.scripts]
peaky = "peaky_finders.peaky_cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
