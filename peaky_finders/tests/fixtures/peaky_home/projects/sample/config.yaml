# Minimal project preset for integration-style tests (not production data).
simulation:
  provider: splatter
  radius_km: 10.0
  modem_presets:
    meshcore-us:
      frequency_mhz: 910.525
      bandwidth_khz: 62.5
      spreading_factor: 7
      coding_rate: 5
      implementation_margin_db: 3.0
      power_dbm: 22.0
      sensitivity_dbm: -121.0
  environment_presets:
    test-desert:
      climate: desert
      polarization: vertical
      clutter_height_m: 1.0
  modem: meshcore-us
  environment: test-desert
  transmitter:
    height_m: 2.0
    gain_dbi: 3.0
    loss_db: 2.0
  receiver:
    height_m: 2.0
    gain_dbi: 3.0
    loss_db: 2.0

display:
  colormap: plasma
  min_dbm: -130.0
  max_dbm: -80.0

land:
  inputs_root: data
  aoi:
    - path: aoi/test.gdb
      layers:
        - name: boundary
  include:
    - path: include/test.gdb
      layers:
        - name: inc_layer
  exclude: []

sites:
  hub:
    name: Hub Site
    loc: [40.42619, -119.5]
  peer-a:
    name: Peer A
    loc: [39.90951, -119.4]
  peer-b:
    name: Peer B
    loc: [39.91342, -119.3]
  peer-c:
    name: Peer C
    loc: [40.40376, -119.6]

links:
  - [hub, peer-a]
  - [hub, peer-b]
  - [hub, peer-c]
