# Global LoRa modem profiles — copied to ``$PEAKY_HOME/modems.yaml`` on first use.
#
# Projects select a preset by name: ``simulation.modem: meshcore-us``
# (or inline overrides: ``simulation.modem: { preset: meshcore-us, power_dbm: 20 }``).
#
# Each entry under ``modem_presets:`` is a named air-interface profile.
# Values here are datasheet-spec; extra scenario margin lives in the environment preset
# (``coverage_pessimism_db``), not in ``implementation_margin_db``.
#
# ── Field reference ───────────────────────────────────────────────────────────
#
# frequency_mhz
#   Carrier frequency in MHz.
#   Allowed: 20 – 30000 (splatter request schema).
#   Used for: FSPL, Fresnel wavelength, decode threshold path.
#
# bandwidth_khz
#   LoRa channel bandwidth in kHz.
#   Allowed: any positive number (typical LoRa: 62.5, 125, 250, 500).
#   Used for: sensitivity scaling when ``sensitivity_dbm`` is omitted.
#
# spreading_factor
#   LoRa spreading factor (SF).
#   Allowed: 6 – 12 (integer).
#   Used for: sensitivity lookup when ``sensitivity_dbm`` is omitted.
#
# coding_rate
#   LoRa coding rate denominator (CR).
#   Allowed: 5 – 8 (integer). Semtech nominal is 5 (4/5).
#   Effect: ±1 dB sensitivity nudge vs CR 5 when deriving sensitivity from SF/BW.
#
# implementation_margin_db
#   Link-budget margin above decode sensitivity (dB), before reliability margin.
#   Allowed: ≥ 0.
#   Folded into ``request.json`` modem block; not combined with environment pessimism
#   in this file (environment adds ``coverage_pessimism_db`` at emit time).
#
# power_dbm
#   TX output power in dBm (default when project ``simulation.transmitter`` has no power).
#   Allowed: any float (typical LoRa handheld: 14 – 30 dBm).
#   Overridden by ``simulation.transmitter.power_dbm`` or ``power_w`` on the project.
#
# sensitivity_dbm
#   Receiver decode threshold in dBm (optional but recommended).
#   Allowed: ≤ 0 dBm typically (-80 … -140).
#   When set: used directly (+ ``implementation_margin_db``) for coverage cutoff.
#   When omitted: derived from SF + bandwidth_khz + coding_rate (Semtech table).
#   Overridden by ``simulation.receiver.sensitivity_dbm`` on the project.
#
# ── Example preset (fully annotated) ────────────────────────────────────────

modem_presets:

  meshcore-us:

    # 910.525 MHz — US ISM / Meshtastic-style band
    frequency_mhz: 910.525

    # 62.5 kHz BW (narrower than 125 kHz default → ~3 dB worse sensitivity if derived)
    bandwidth_khz: 62.5

    # SF7 — fastest air time, least link budget vs higher SF
    spreading_factor: 7

    # CR 4/5
    coding_rate: 5

    # 3 dB implementation margin on top of sensitivity_dbm
    implementation_margin_db: 3.0

    # 22 dBm TX unless project transmitter overrides
    power_dbm: 22.0

    # Explicit decode floor; skips SF/BW derivation
    sensitivity_dbm: -121.0
  meshcore-us-copy:
    frequency_mhz: 910.525
    bandwidth_khz: 62.5
    spreading_factor: 7
    coding_rate: 5
    implementation_margin_db: 3.0
    power_dbm: 22.0
    sensitivity_dbm: -121.0
